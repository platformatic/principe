name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number to tag and release'
        required: true
        type: string
      prerelease:
        description: 'Release as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  bump-version:
    if: github.ref_name == 'main'
    runs-on: ubuntu-26.04
    environment: main
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Use supported Node.js Version
        uses: actions/setup-node@v4
        with:
          node-version: 26.10.0

      - name: Restore cached dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: node-modules-${{ hashFiles('package.json') }}

      - name: Install dependencies
        # Version bumping needs JavaScript dependencies only, not the native prepare hook.
        run: pnpm install --ignore-scripts

      - name: Bump Version
        id: bump
        run: |
          node src/scripts/bump-version.js "$REQUESTED_VERSION" "$RELEASE_ACTOR"
          node --input-type=module -e 'import { appendFileSync, readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)'
        env:
          GITHUB_ACTIONS: 'true'
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_ACTOR: ${{ github.actor }}

      - name: Create tag
        run: git tag "v$VERSION"
        env:
          VERSION: ${{ steps.bump.outputs.version }}

      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}

      - name: Push tag
        run: git push origin "v$VERSION"
        env:
          VERSION: ${{ steps.bump.outputs.version }}

  release:
    needs: bump-version
    if: always() && !failure() && !cancelled()
    name: Release ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    environment: main
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-26.04
          - platform: linux
            arch: arm64
            os: ubuntu-26.04-arm
          - platform: macos
            arch: x64
            os: macos-15-intel
          - platform: macos
            arch: arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.version && format('refs/tags/v{0}', needs.bump-version.outputs.version) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Use supported Node.js Version
        uses: actions/setup-node@v4
        with:
          node-version: 26.10.0

      - name: Restore cached dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: node-modules-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json') }}

      - name: Install Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsdl3-dev tar

      - name: Install macOS prerequisites
        if: matrix.platform == 'macos'
        run: brew install pkg-config sdl3

      - name: Install dependencies
        run: pnpm install

      - name: Build executable
        run: pnpm run sea
        env:
          NODE_BUILD_BASE_URL: ${{ vars.NODE_BUILD_BASE_URL || secrets.NODE_BUILD_BASE_URL }}

      - name: Notarize macOS executable
        if: matrix.platform == 'macos'
        run: pnpm run notarize:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Prepare artifact
        run: bash src/scripts/prepare-artifact.sh "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: principe-${{ matrix.platform }}-${{ matrix.arch }}
          path: tmp/artifact-${{ matrix.platform }}-${{ matrix.arch }}/*

  publish-release:
    if: github.ref_name == 'main'
    needs: [bump-version, release]
    runs-on: ubuntu-26.04
    environment: main
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.bump-version.outputs.version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        run: bash src/scripts/publish-release.sh "$VERSION" "$PRERELEASE" artifacts
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
